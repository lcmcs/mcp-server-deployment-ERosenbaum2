services:
  - type: web
    name: minyan-finder-mcp-server
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn minyan_mcp_server:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PORT
        value: 10000
      - key: MINYAN_FINDER_API_BASE_URL
        value: https://minyan-finder-api.onrender.com


